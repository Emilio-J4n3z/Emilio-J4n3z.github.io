  about:
    enable: true
    title: "Sobre Mí"
    image: "/images/me_fondo_azul.jpg"
    # REVISAR: "acceso sin autenticación a n8n" / CWE-306. Tu evidencia muestra que n8n tiene login.
    content: |-
      Ingeniero en Sistemas Computacionales (graduación dic. 2026, TESCI) con doble titulación simultánea en Matemáticas Aplicadas y Computación en la FES Acatlán UNAM.

      En mi residencia profesional en IIMAS-UNAM evalué la seguridad de un servidor con 4 aplicaciones web, identifiqué 8 vulnerabilidades documentadas con CVSS v3.1, CWE y MITRE ATT&CK — la más grave con CVSS 9.8 (CWE-306, acceso sin autenticación a n8n). También integré LLMs locales (Ollama) al triage de hallazgos con validación humana.

      Mi objetivo es desarrollarme en Blue Team y seguridad de aplicaciones, entendiendo el ataque para defender mejor.
    skills:
      enable: true
      title: "Tecnologías con las que trabajo:"
      items:
        - "Python · Bash · C/C++"
        - "FastAPI · Flask · HTMX"
        - "Nmap · Burp Suite · OWASP ZAP"
        - "Nikto · Gobuster · Lynis"
        - "CVSS v3.1 · CWE · MITRE ATT&CK"
        - "Docker · Git · Linux"
        - "nginx · TLS/SSL · SSH"
        - "OWASP Top 10 · CIS · NIST"

  experience:
    enable: true
    items:
      - company: "IIMAS-UNAM"
        companyUrl: "https://www.iimas.unam.mx"
        jobs:
          # REVISAR: fechas (CV/sitio mar-jul; informe abr-jul; evidencias hasta sept. 2026)
          - name: "Residente Profesional — Seguridad de Aplicaciones Web"
            date: "Mar 2026 - Jul 2026"
            info:
              content: Ciudad de México
            content: |
              - Evaluación iterativa de un servidor con 4 aplicaciones web: reconocimiento (OSINT pasivo, Nmap, WhatWeb, Gobuster), pruebas OWASP Top 10 (ZAP, Burp Suite, Nikto)
              - Identifiqué 8 vulnerabilidades; la más grave: acceso sin autenticación a n8n (CVSS 9.8, CWE-306) con riesgo de ejecución de código
              - Documenté cada hallazgo con evidencia, CVSS v3.1, CWE y técnica MITRE ATT&CK
              - Propuse mitigaciones priorizadas (inmediato, 1–4 semanas, 1–3 meses) con base en CIS y NIST
              - Integré LLMs locales (Ollama) al triage de resultados — la IA propone, una persona valida

          - name: "Asistente de Investigación — NLP y Documentos Legales"
            date: "Ago 2025 - Feb 2026"
            info:
              content: Part-time · 20 hrs/semana
            content: |
              - Análisis automatizado de 500+ documentos legales con extracción de entidades (NER)
              - Visualización de grafos de citación con FastAPI, HTMX y Tailwind CSS
              - Búsqueda con Meilisearch · despliegue con Docker

      - company: "OffSec Community"
        companyUrl: "https://github.com/Emilio-J4n3z"
        jobs:
          - name: "Mentor en Seguridad y Líder Comunitario"
            date: "Feb 2025 - Presente"
            info:
              content: Voluntario · CDMX
            content: |
              - Mentoría en fundamentos de seguridad, metodologías CTF y criptografía
              - Soporte técnico en software libre y entornos virtuales de laboratorio

      - company: "Independiente / Open Source"
        companyUrl: "https://github.com/Emilio-J4n3z"
        jobs:
          - name: "Investigador en Ciberseguridad"
            date: "Feb 2025 - Presente"
            info:
              content: Voluntario
            content: |
              - CTF internacionales (PicoCTF, HackTheBox, TryHackMe, EchoCTF): web exploitation, criptografía y binary exploitation
              - Práctica ofensiva para mejorar detección y defensa · Miembro del equipo white_void (CTFtime)

      # CAMBIO: se quitó companyUrl "#". Si tu tema falla sin ese campo,
      # pon aquí la URL real de CEDETEC LASC o https://emilio-j4n3z.github.io/
