{{/*
Shortcode para mostrar estadísticas en formato de grid
Uso: {{< stats "15,CTF Resueltos" "8,Writeups" "23,Vulnerabilidades" "5,Herramientas" >}}
*/}}
<div class="stats-counter">
  {{ range .Params }}
    {{ $parts := split . "," }}
    {{ if eq (len $parts) 2 }}
      <div class="stat-item">
        <div class="stat-number">{{ index $parts 0 }}</div>
        <div class="stat-label">{{ index $parts 1 }}</div>
      </div>
    {{ end }}
  {{ end }}
</div>
